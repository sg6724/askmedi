[project]
name = "askmedi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9",
  "litellm>=1.50",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: needs a local Supabase Postgres (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
