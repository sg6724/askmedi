# AskMedi red-flag rules, version 1.
# review_status: source-derived — written from the cited public sources, not yet signed off by a clinician.
#
# Matching (see askmedi/safety/red_flags.py): text is lower-cased, NFC-normalised, punctuation is
# turned into spaces, and each phrase must match whole words. A phrase ending in "*" matches any word
# that starts with the last word (e.g. "saans*" matches "saans" and "saanse").
# A rule fires when ANY phrase in `keywords` matches, or when EVERY group of one entry in `combos`
# has a matching phrase (e.g. pregnancy AND bleeding).
# action: emergency_112 -> call 112 (national emergency) then 108; emergency_108 -> ambulance 108 first.
version: 1
review_status: source-derived

messages:
  en: "This could be a medical emergency. Call {numbers} now or go to the nearest emergency department. Do not wait."
  hi: "यह मेडिकल इमरजेंसी हो सकती है। अभी {numbers} पर कॉल करें या नज़दीकी इमरजेंसी विभाग जाएँ। इंतज़ार न करें।"
  mr: "ही वैद्यकीय आणीबाणी असू शकते. आत्ताच {numbers} वर कॉल करा किंवा जवळच्या आपत्कालीन विभागात जा. वाट पाहू नका."

